<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Tubes Grafkom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            align-items: stretch;
            justify-content: center;
            max-width: 960px;
            width: 100%;
        }

        .canvas-area {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            border: 3px solid #ff7700;
            background-color: #ffffff;
            display: block;
            border-radius: 4px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 260px;
            padding: 8px;
        }

        .judul-area {
            text-align: right;
        }

        .Snake {
            color: #ffffff;
            font-size: 100px;
        }

        .game {
            color: #ff7700;
            font-size: 110px;
        }

        .judul-area p {
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: 6px;
            opacity: 0.8;
        }

        .kontrol-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .tombolGUI {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background-color: #1c1c1c;
            border: 2px solid #ff7700;
            padding: 16px;
            border-radius: 6px;
        }

        .row-tombol {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        button {
            background-color: #121212;
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            min-width: 64px;
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        button:hover {
            background-color: #ff7700;
            border-color: #ff7700;
            color: #000000;
        }

        #btn-restart {
            border-color: #ff7700;
            color: #ff7700;
        }

        #btn-restart:hover {
            background-color: #ff7700;
            color: #000000;
        }

        .footer {
            color: #ffffff;
            text-align: center;
        }
    </style>
    <script type="module" src="index.js"></script>
</head>
<body>
    <div class="container">
        <div class="canvas-area">
            <canvas width="520" height="520" id="mycanvas"></canvas>
        </div>
        <div class="sidebar">
            <div class="judul-area">
                <h1 class="Snake">SNAKE</h1>
                <p>
                <h1 class="game">GAME</h1>
            </div>

            <div class="kontrol-area">
                <div class="tombolGUI">
                    <div class="row-tombol">
                        <button id="btn-atas">Atas</button>
                    </div>
                    <div class="row-tombol">
                        <button id="btn-kiri">Kiri</button>
                        <button id="btn-restart">Ulang</button>
                        <button id="btn-kanan">Kanan</button>
                    </div>
                    <div class="row-tombol">
                        <button id="btn-bawah">Bawah</button>
                    </div>
                </div>
                <div class="footer">
                    <p>Created by</p>
                    <p>2472009 - Lorencia Sharon Fadjar | 2472023 - Gearald | 2472035 - Dominic Samuel Onggowidjaja</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
